name: mai_fitness
description: "Fitness: Übungen, Trainingsplan, Fortschritt — lokal, ohne Konto (Mai Fitness)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  sqlite3: ^3.7.0
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  mai_backup_format:
    path: packages/mai_backup_format

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  generate: true
  uses-material-design: true

# Datenbank verschlüsselt (SQLite3 Multiple Ciphers), wie Mai Budget Planer.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
