name: Fehler melden
description: Etwas in „Fitness“ funktioniert nicht wie erwartet.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Danke, dass du dir die Zeit nimmst! Bitte beachte:
        **Issues sind öffentlich.** Trage keine persönlichen Daten ein, insbesondere keine Körper- und Trainingsdaten (Gewicht, Maße, Trainingsverlauf).
        Screenshots nur mit erfundenen Beispieleinträgen, Sicherungsdateien niemals anhängen.
        English is welcome, too.
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert?
      description: Beschreibe kurz, was nicht funktioniert.
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Wie lässt sich der Fehler auslösen?
      description: Schritt für Schritt, so dass man es nachstellen kann.
      placeholder: |
        1. App öffnen
        2. …
        3. …
    validations:
      required: false
  - type: textarea
    id: erwartet
    attributes:
      label: Was hättest du erwartet?
    validations:
      required: false
  - type: dropdown
    id: wo
    attributes:
      label: Wo tritt der Fehler auf?
      multiple: true
      options:
        - App auf dem Handy
        - Widget auf dem Startbildschirm
        - Uhr (Wear OS)
        - Benachrichtigung
        - Sicherung / Export / Import
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: App-Version
      description: Steht in Android unter Einstellungen → Apps → Fitness.
      placeholder: z. B. 1.0.0
    validations:
      required: false
  - type: input
    id: geraet
    attributes:
      label: Gerät und Android-Version
      placeholder: z. B. Pixel 8, Android 16
    validations:
      required: false
  - type: checkboxes
    id: datenschutz
    attributes:
      label: Datenschutz
      options:
        - label: Ich habe keine persönlichen Daten (z. B. Körper- und Trainingsdaten (Gewicht, Maße, Trainingsverlauf)) in diese Meldung geschrieben oder angehängt.
          required: true
